# Secret-scanning configuration (gitleaks). The default rules stay on; only obvious test fixtures are allowed.
title = "Beginso gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation placeholders only"
paths = [
  '''(^|/)__tests__/''',
  '''(^|/)e2e/''',
  '''package-lock\.json$''',
]
# The patterns below are matched against the whole line, so a placeholder can be recognised by what surrounds it.
regexTarget = "line"
regexes = [
  # A fake PEM key used as a placeholder when no real key file exists.
  '''-----BEGIN PRIVATE KEY-----\\nMOCK_KEY\\n-----END PRIVATE KEY-----''',
  # Secrets that say they are for tests.
  '''(?i)test[-_]only[-_a-z0-9]*''',
  '''(?i)["']test-[-_a-z0-9]{6,}["']''',
]
