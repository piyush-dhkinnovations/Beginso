name: e2e

# The Playwright suite (public form, builder reload loss, shell accessibility, tablet sidebar). It runs the app against a small mock
# backend (e2e/mockServer.ts), so it needs no real service and no secrets. GitHub-hosted runner only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Not .nvmrc: the mock backend is started as `node e2e/mockServer.ts`, which needs a Node that runs TypeScript files
          # directly (22.18+). Node 20 stops with ERR_UNKNOWN_FILE_EXTENSION. The same Node as local development.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only: it is the only browser the suite uses.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      - name: Upload the Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
