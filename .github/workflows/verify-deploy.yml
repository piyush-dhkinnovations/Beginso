name: Verify Frontend Deploy

# The frontend is deployed by Vercel when `main` changes, outside GitHub Actions, so GitHub (and the Releases pages of the Admin console) had no
# deploy run to show for it: the Deploy step of every frontend commit read "not run". This workflow is that run. It does not deploy anything.
# After a push to `main` it asks the live site, every 20 seconds for up to 15 minutes, which commit it is serving (/build-info.json, written by
# `npm run prebuild`), and finishes green when the site serves this commit, red when it does not within 15 minutes. While it waits it is
# "in progress", which the Admin shows as "Deploying".
#
# Uses the repository variable SMOKE_SITE_URL (the live site, for example https://www.beginso.com), the same one the smoke workflow uses.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Live commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: ${{ vars.SMOKE_SITE_URL }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: The site address is set
        run: |
          [ -n "$SITE" ] || { echo "::error::Repository variable SMOKE_SITE_URL is not set"; exit 1; }

      - name: Wait until the live site serves this commit
        run: |
          short="${COMMIT_SHA:0:7}"
          url="${SITE%/}/build-info.json"
          echo "waiting for $url to report $short"
          for i in $(seq 1 45); do
            body="$(curl -fsS --max-time 10 "$url" || true)"
            if echo "$body" | grep -q "\"commit\":\"$short\""; then
              echo "The live site serves commit $short"
              exit 0
            fi
            echo "attempt $i: the site answered: $(echo "$body" | head -c 160)"
            sleep 20
          done
          echo "::error::The live site does not serve commit $short after 15 minutes (the Vercel build may have failed or is still running)"
          exit 1
